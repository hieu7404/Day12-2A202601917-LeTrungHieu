name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Workflow chỉ cần quyền đọc mã nguồn. Deploy dùng deploy hook của Render được
# lưu trong GitHub Secret, vì vậy repository không chứa thông tin nhạy cảm.
permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      AGENT_API_KEY: ci-test-key
      REDIS_URL: fake://
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run unit and integration tests
        # Test bonus tự kiểm tra badge công khai của workflow. Không chạy nó
        # trong CI để tránh vòng lặp khi GitHub đang cập nhật badge.
        run: pytest tests/ -v -m "not docker" --ignore=tests/test_cp5.py --ignore=tests/test_bonus_cicd.py

  build:
    name: Build Docker image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Build image
        run: docker build --tag day12-agent:${{ github.sha }} .

  deploy:
    name: Deploy to Render
    needs: [test, build]
    # Pull request chỉ kiểm tra code, tuyệt đối không được deploy.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: curl --fail --show-error --silent --request POST "$RENDER_DEPLOY_HOOK"
